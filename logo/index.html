<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strategy • Grow • Impact</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #0a1628 0%, #02040a 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* background soft light */
    body::before {
      content: "";
      position: absolute;
      width: 120%;
      height: 60%;
      bottom: -20%;
      background: radial-gradient(ellipse, rgba(0, 150, 255, 0.08) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .container {
      display: flex;
      gap: 28px;
      padding: 40px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      width: 320px;
      height: 420px;
      background: rgba(10, 25, 50, 0.35);
      border: 1px solid rgba(100, 180, 255, 0.15);
      border-radius: 16px;
      position: relative;
      backdrop-filter: blur(12px);
      overflow: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.05);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(100, 200, 255, 0.4);
      box-shadow: 0 0 60px rgba(0, 150, 255, 0.15);
    }

    /* grid lines */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(100, 180, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 180, 255, 0.07) 1px, transparent 1px);
      background-size: 50% 50%;
      pointer-events: none;
    }

    .number {
      position: absolute;
      top: 22px;
      left: 24px;
      font-size: 15px;
      color: rgba(180, 220, 255, 0.6);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .icon-area {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ========== ICON 1: CUBES ========== */
    .cubes {
      width: 140px;
      height: 140px;
      position: relative;
      transform: rotateX(55deg) rotateZ(45deg);
      transform-style: preserve-3d;
    }

    .cube {
      position: absolute;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(0, 200, 255, 0.3), rgba(180, 50, 255, 0.4));
      border: 1.5px solid rgba(150, 220, 255, 0.6);
      box-shadow: 
        0 0 20px rgba(0, 200, 255, 0.5),
        inset 0 0 15px rgba(255, 100, 255, 0.3);
    }

    .cube:nth-child(1) { top: 0; left: 46px; }
    .cube:nth-child(2) { top: 46px; left: 0; }
    .cube:nth-child(3) { top: 46px; left: 46px; }
    .cube:nth-child(4) { top: 46px; left: 92px; }
    .cube:nth-child(5) { top: 92px; left: 46px; }
    .cube:nth-child(6) { top: 92px; left: 92px; }

    /* ========== ICON 2: PLANT ========== */
    .plant {
      position: relative;
      width: 120px;
      height: 140px;
    }

    .base {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(90deg, #00e5ff, #a020f0);
      box-shadow: 0 0 30px #00e5ff, 0 0 60px #a020f0;
    }

    .stem {
      position: absolute;
      bottom: 18px;
      left: 50%;
      width: 6px;
      height: 50px;
      background: linear-gradient(to top, #00e5ff, #80ffea);
      transform: translateX(-50%);
      border-radius: 3px;
      box-shadow: 0 0 12px #00e5ff;
    }

    .leaf {
      position: absolute;
      width: 38px;
      height: 55px;
      background: linear-gradient(135deg, #00f0ff, #c040ff);
      border-radius: 0 80% 0 80%;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
      filter: brightness(1.2);
    }

    .leaf.l1 { bottom: 55px; left: 18px; transform: rotate(-35deg); }
    .leaf.l2 { bottom: 60px; right: 18px; transform: rotate(35deg) scaleX(-1); }
    .leaf.l3 { bottom: 85px; left: 35px; transform: rotate(-15deg) scale(0.7); }
    .leaf.l4 { bottom: 90px; right: 35px; transform: rotate(15deg) scaleX(-1) scale(0.7); }

    /* ========== ICON 3: TARGET ========== */
    .target {
      position: relative;
      width: 130px;
      height: 130px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 4px solid;
      box-shadow: 0 0 15px currentColor;
    }

    .ring1 { inset: 0; border-color: #ff2a6d; box-shadow: 0 0 25px #ff2a6d; }
    .ring2 { inset: 18px; border-color: #00e5ff; box-shadow: 0 0 20px #00e5ff; }
    .ring3 { inset: 36px; border-color: #c040ff; box-shadow: 0 0 15px #c040ff; }
    .ring4 { inset: 54px; background: radial-gradient(circle, #ff2a6d, #a020f0); box-shadow: 0 0 20px #ff2a6d; }

    .arrow {
      position: absolute;
      width: 90px;
      height: 8px;
      background: linear-gradient(90deg, #00e5ff, #ff2a6d);
      top: 50%;
      left: 55%;
      transform: translateY(-50%) rotate(-25deg);
      border-radius: 4px;
      box-shadow: 0 0 15px #00e5ff;
    }

    .arrow::after {
      content: "";
      position: absolute;
      right: -12px;
      top: -8px;
      width: 0;
      height: 0;
      border-left: 18px solid #ff2a6d;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      filter: drop-shadow(0 0 8px #ff2a6d);
    }

    .title {
      position: absolute;
      bottom: 50px;
      left: 24px;
      right: 24px;
      color: #e8f4ff;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
    }

    .arrow-btn {
      position: absolute;
      bottom: 22px;
      right: 22px;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(150, 200, 255, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0d0ff;
      font-size: 18px;
      transition: all 0.3s;
    }

    .card:hover .arrow-btn {
      background: rgba(0, 150, 255, 0.15);
      border-color: #00e5ff;
      color: #00e5ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Card 1 -->
    <div class="card">
      <div class="number">01</div>
      <div class="icon-area">
        <div class="cubes">
          <div class="cube"></div>
          <div class="cube"></div>
          <div class="cube"></div>
          <div class="cube"></div>
          <div class="cube"></div>
          <div class="cube"></div>
        </div>
      </div>
      <div class="title">Strategy<br>First</div>
      <div class="arrow-btn">↗</div>
    </div>

    <!-- Card 2 -->
    <div class="card">
      <div class="number">02</div>
      <div class="icon-area">
        <div class="plant">
          <div class="base"></div>
          <div class="stem"></div>
          <div class="leaf l1"></div>
          <div class="leaf l2"></div>
          <div class="leaf l3"></div>
          <div class="leaf l4"></div>
        </div>
      </div>
      <div class="title">Grow<br>Organically</div>
      <div class="arrow-btn">↗</div>
    </div>

    <!-- Card 3 -->
    <div class="card">
      <div class="number">03</div>
      <div class="icon-area">
        <div class="target">
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>
          <div class="ring ring3"></div>
          <div class="ring ring4"></div>
          <div class="arrow"></div>
        </div>
      </div>
      <div class="title">Impact That<br>Connects</div>
      <div class="arrow-btn">↗</div>
    </div>
  </div>
</body>
</html>
