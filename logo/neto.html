<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N NETO - Kristal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* soft grid background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(80, 140, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 140, 255, 0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 480px;
      height: 580px;
    }

    svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px rgba(0, 180, 255, 0.35));
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 480 580" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Crystal gradient -->
        <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
          <stop offset="30%" stop-color="#40b0ff" stop-opacity="0.8"/>
          <stop offset="60%" stop-color="#b040ff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ff50c0" stop-opacity="0.7"/>
        </linearGradient>

        <linearGradient id="edge" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.25"/>
        </linearGradient>

        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- ========== JULAT BRACE ========== -->
      <path d="M95 70 
               Q70 70 70 95 
               L70 460 
               Q70 485 95 485" 
            stroke="#00e5ff" 
            stroke-width="5" 
            fill="none" 
            stroke-linecap="round"
            filter="url(#softGlow)"/>
      
      <text x="42" y="285" 
            fill="#00e5ff" 
            font-size="22" 
            font-weight="700" 
            letter-spacing="2"
            transform="rotate(-90 42 285)" 
            text-anchor="middle">JULAT</text>

      <!-- ========== CRYSTAL ========== -->
      <!-- Main body -->
      <path d="M240 95 
               L290 155 
               L290 380 
               L240 460 
               L190 380 
               L190 155 Z" 
            fill="url(#crystal)" 
            stroke="#a0f0ff" 
            stroke-width="2.5"
            filter="url(#glow)"
            opacity="0.95"/>

      <!-- Facet lines -->
      <path d="M240 95 L240 460" stroke="#ffffff" stroke-width="1.8" opacity="0.55"/>
      <path d="M190 155 L290 155" stroke="#c0f0ff" stroke-width="1.5" opacity="0.5"/>
      <path d="M190 380 L290 380" stroke="#e080ff" stroke-width="1.5" opacity="0.5"/>
      <path d="M210 200 L270 200" stroke="#ffffff" stroke-width="1.1" opacity="0.35"/>
      <path d="M210 320 L270 320" stroke="#ffffff" stroke-width="1.1" opacity="0.35"/>
      <path d="M215 255 L265 255" stroke="#ffffff" stroke-width="0.9" opacity="0.25"/>

      <!-- Bright edges -->
      <path d="M240 95 L290 155 L290 220" stroke="url(#edge)" stroke-width="2.2" fill="none" opacity="0.8"/>
      <path d="M240 95 L190 155 L190 220" stroke="url(#edge)" stroke-width="2.2" fill="none" opacity="0.8"/>

      <!-- Text inside crystal -->
      <text x="240" y="270" 
            text-anchor="middle" 
            fill="white" 
            font-size="48" 
            font-weight="800"
            filter="url(#glow)">N</text>
      <text x="240" y="300" 
            text-anchor="middle" 
            fill="white" 
            font-size="18" 
            font-weight="700" 
            letter-spacing="3">NETO</text>

      <!-- ========== LABELS ========== -->

      <!-- T TINGGI -->
      <circle cx="240" cy="55" r="8" fill="#00b4ff" filter="url(#glow)"/>
      <line x1="240" y1="63" x2="240" y2="95" stroke="#80d0ff" stroke-width="3"/>
      <text x="260" y="62" fill="#b0e0ff" font-size="16" font-weight="600">T TINGGI</text>

      <!-- A ATAS -->
      <text x="305" y="145" fill="#b0e0ff" font-size="16" font-weight="500">A ATAS</text>

      <!-- I INTI -->
      <text x="340" y="265" fill="#80e0ff" font-size="16" font-weight="600">I INTI</text>
      <line x1="290" y1="272" x2="325" y2="272" 
            stroke="#00e5ff" stroke-width="2.2" stroke-dasharray="6 4"/>
      <polygon points="325,267 338,272 325,277" fill="#00e5ff"/>

      <!-- A AWAL -->
      <text x="70" y="360" fill="#40e090" font-size="16" font-weight="600">A AWAL</text>
      <line x1="145" y1="367" x2="190" y2="367" 
            stroke="#40e090" stroke-width="2.2" stroke-dasharray="6 4"/>
      <polygon points="145,362 133,367 145,372" fill="#40e090"/>

      <!-- B BAWAH + R RENDAH -->
      <line x1="240" y1="460" x2="240" y2="490" stroke="#80d0ff" stroke-width="3"/>
      <circle cx="240" cy="500" r="8" fill="#ff4060" filter="url(#glow)"/>
      <text x="260" y="485" fill="#b0e0ff" font-size="16" font-weight="500">B BAWAH</text>
      <text x="260" y="508" fill="#ff6080" font-size="16" font-weight="600">R RENDAH</text>

      <!-- TABRANIJ button -->
      <rect x="155" y="530" width="170" height="32" rx="16" 
            fill="rgba(0,25,60,0.75)" 
            stroke="#00c8ff" 
            stroke-width="2"/>
      <text x="240" y="552" 
            text-anchor="middle" 
            fill="#00e5ff" 
            font-size="16" 
            font-weight="700" 
            letter-spacing="2">TABRANIJ</text>
    </svg>
  </div>
</body>
</html>
