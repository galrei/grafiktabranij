<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N NETO - Three.js Glass Crystal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #02040a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
    }
    canvas { display: block; }

    /* Labels overlay */
    .label {
      position: absolute;
      color: #c0e8ff;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,180,255,0.6);
      z-index: 10;
    }
    .label.green { color: #3ce090; }
    .label.red { color: #ff6b8a; }
    .label.cyan { color: #00e5ff; }

    #julat {
      left: 38px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #00e5ff;
    }

    #tinggi { top: 9%; left: 54%; }
    #atas { top: 22%; left: 68%; }
    #inti { top: 42%; left: 72%; }
    #awal { top: 58%; left: 12%; }
    #bawah { top: 78%; left: 54%; }
    #rendah { top: 82%; left: 54%; }

    #tabranij {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 30, 70, 0.85);
      border: 2px solid #00c4ff;
      color: #00e5ff;
      padding: 8px 28px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 15px;
      z-index: 10;
    }

    /* brace */
    #brace {
      position: absolute;
      left: 70px;
      top: 12%;
      height: 68%;
      width: 20px;
      border: 5px solid #00e5ff;
      border-right: none;
      border-radius: 30px 0 0 30px;
      box-shadow: 0 0 15px #00e5ff;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Labels -->
  <div id="brace"></div>
  <div id="julat" class="label cyan">JULAT</div>
  <div id="tinggi" class="label">T TINGGI</div>
  <div id="atas" class="label">A ATAS</div>
  <div id="inti" class="label">I INTI</div>
  <div id="awal" class="label green">A AWAL</div>
  <div id="bawah" class="label">B BAWAH</div>
  <div id="rendah" class="label red">R RENDAH</div>
  <div id="tabranij">TABRANIJ</div>

  <!-- Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // Lights for neon glass look
    const ambient = new THREE.AmbientLight(0x112233, 0.4);
    scene.add(ambient);

    const light1 = new THREE.PointLight(0x00e5ff, 2.5, 20);
    light1.position.set(3, 4, 5);
    scene.add(light1);

    const light2 = new THREE.PointLight(0xff40c0, 2.2, 20);
    light2.position.set(-3, -2, 4);
    scene.add(light2);

    const light3 = new THREE.PointLight(0x80a0ff, 1.5, 15);
    light3.position.set(0, 5, -3);
    scene.add(light3);

    // Crystal geometry (pointed top & bottom)
    const points = [];
    points.push(new THREE.Vector2(0, 1.8));      // top tip
    points.push(new THREE.Vector2(0.85, 1.1));
    points.push(new THREE.Vector2(0.95, 0.3));
    points.push(new THREE.Vector2(0.95, -0.9));
    points.push(new THREE.Vector2(0.85, -1.5));
    points.push(new THREE.Vector2(0, -1.9));     // bottom tip

    const geometry = new THREE.LatheGeometry(points, 8); // 8 sides = faceted

    // Glass material
    const material = new THREE.MeshPhysicalMaterial({
      color: 0xa0e0ff,
      metalness: 0.1,
      roughness: 0.05,
      transmission: 0.95,          // glass transparency
      thickness: 1.5,
      ior: 1.5,
      transparent: true,
      opacity: 0.9,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      envMapIntensity: 2,
      side: THREE.DoubleSide
    });

    const crystal = new THREE.Mesh(geometry, material);
    crystal.rotation.y = Math.PI / 8;
    scene.add(crystal);

    // Soft outer glow (using another slightly larger mesh)
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x00c8ff,
      transparent: true,
      opacity: 0.12,
      side: THREE.BackSide
    });
    const glowMesh = new THREE.Mesh(geometry.clone().scale(1.08, 1.08, 1.08), glowMat);
    scene.add(glowMesh);

    // Animation
    function animate() {
      requestAnimationFrame(animate);
      crystal.rotation.y += 0.004;
      glowMesh.rotation.y = crystal.rotation.y;
      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
