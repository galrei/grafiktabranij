<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N NILAI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* grid background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(100, 140, 200, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 140, 200, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 420px;
      height: 520px;
    }

    /* Green bar */
    .bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 220px;
      background: linear-gradient(180deg, #2ee6a0, #1fc48a);
      border-radius: 28px;
      box-shadow: 
        0 0 40px rgba(46, 230, 160, 0.6),
        0 0 80px rgba(46, 230, 160, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .bar .n {
      font-size: 52px;
      font-weight: 800;
      color: white;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      line-height: 1;
    }

    .bar .nilai {
      font-size: 16px;
      font-weight: 600;
      color: white;
      letter-spacing: 1px;
      margin-top: 4px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    /* Labels */
    .label {
      position: absolute;
      font-size: 15px;
      font-weight: 600;
      color: #a8c4e8;
      white-space: nowrap;
    }

    /* Top */
    .tinggi {
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .tinggi .dot {
      width: 12px;
      height: 12px;
      background: #4a9eff;
      border-radius: 50%;
      box-shadow: 0 0 12px #4a9eff;
    }
    .tinggi .line {
      width: 2px;
      height: 55px;
      background: #6a9fd8;
    }

    .atas {
      top: 95px;
      left: 58%;
    }

    /* Right */
    .inti {
      top: 48%;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .inti .arrow {
      width: 40px;
      height: 2px;
      background: repeating-linear-gradient(90deg, #6a9fd8 0 4px, transparent 4px 8px);
      position: relative;
    }
    .inti .arrow::after {
      content: "";
      position: absolute;
      right: -6px;
      top: -4px;
      border: 5px solid transparent;
      border-left: 8px solid #6a9fd8;
    }

    /* Left */
    .awal {
      top: 62%;
      left: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3dd68c;
    }
    .awal .arrow {
      width: 40px;
      height: 2px;
      background: repeating-linear-gradient(90deg, #3dd68c 0 4px, transparent 4px 8px);
      position: relative;
    }
    .awal .arrow::before {
      content: "";
      position: absolute;
      left: -6px;
      top: -4px;
      border: 5px solid transparent;
      border-right: 8px solid #3dd68c;
    }

    /* Bottom */
    .bawah {
      bottom: 95px;
      left: 58%;
    }

    .rendah {
      bottom: 55px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .rendah .line {
      width: 2px;
      height: 40px;
      background: #6a9fd8;
    }
    .rendah .dot {
      width: 12px;
      height: 12px;
      background: #ff5a6e;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff5a6e;
    }
    .rendah span {
      color: #ff7a8a;
    }

    /* Bottom button */
    .tabrani {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a3a5c;
      color: #4db8ff;
      padding: 8px 28px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Green bar -->
    <div class="bar">
      <div class="n">N</div>
      <div class="nilai">NILAI</div>
    </div>

    <!-- Top -->
    <div class="tinggi">
      <div class="dot"></div>
      <div class="line"></div>
      <div class="label" style="margin-top: 4px;">T TINGGI</div>
    </div>
    <div class="label atas">A ATAS</div>

    <!-- Right -->
    <div class="inti">
      <div class="arrow"></div>
      <div class="label">I INTI</div>
    </div>

    <!-- Left -->
    <div class="awal">
      <div class="label">A AWAL</div>
      <div class="arrow"></div>
    </div>

    <!-- Bottom -->
    <div class="label bawah">B BAWAH</div>
    <div class="rendah">
      <div class="line"></div>
      <div class="dot"></div>
      <span class="label">R RENDAH</span>
    </div>

    <!-- Button -->
    <div class="tabrani">TABRANI</div>
  </div>
</body>
</html>
