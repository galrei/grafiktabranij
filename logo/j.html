<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABRANIJ Crystal Diagram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e17;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 700px;
      height: 700px;
    }

    /* Crystal */
    .crystal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 340px;
      filter: drop-shadow(0 0 25px rgba(100, 180, 255, 0.6));
    }

    .crystal svg {
      width: 100%;
      height: 100%;
    }

    /* Labels */
    .label {
      position: absolute;
      color: white;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(100, 180, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .label .letter {
      font-size: 22px;
      font-weight: 700;
    }

    /* Positions */
    .t-tinggi { top: 95px; left: 420px; }
    .a-atas   { top: 155px; left: 420px; }
    .i-inti   { top: 215px; left: 480px; }
    .b-bawah  { top: 430px; left: 420px; }
    .r-rendah { top: 490px; left: 420px; }

    .a-awal {
      top: 380px;
      left: 40px;
    }

    .julat {
      position: absolute;
      left: 30px;
      top: 200px;
      color: white;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-shadow: 0 0 10px rgba(100, 180, 255, 0.7);
    }

    /* Lines & dots */
    .line {
      position: absolute;
      background: linear-gradient(90deg, transparent, #4fc3f7, transparent);
      height: 2px;
    }

    .dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .dot.blue { background: #4fc3f7; color: #4fc3f7; }
    .dot.red  { background: #ff5252; color: #ff5252; }

    .title {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #1a237e, #0d47a1);
      color: white;
      padding: 12px 48px;
      border-radius: 50px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      box-shadow: 0 0 20px rgba(30, 100, 255, 0.5);
    }

    /* Bracket for JULAT */
    .bracket {
      position: absolute;
      left: 95px;
      top: 130px;
      width: 40px;
      height: 340px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Crystal -->
    <div class="crystal">
      <svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ec8ff"/>
            <stop offset="30%" stop-color="#4a9eff"/>
            <stop offset="60%" stop-color="#2a6aff"/>
            <stop offset="100%" stop-color="#1a3a8f"/>
          </linearGradient>
          <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
            <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Main crystal shape -->
        <path d="M100 20 
                 L160 80 
                 L175 160 
                 L145 280 
                 L100 300 
                 L55 280 
                 L25 160 
                 L40 80 Z" 
              fill="url(#crystalGrad)" 
              stroke="#a0d8ff" 
              stroke-width="2"
              filter="url(#glow)"/>

        <!-- Facets -->
        <path d="M100 20 L160 80 L100 140 Z" fill="rgba(255,255,255,0.25)"/>
        <path d="M100 20 L40 80 L100 140 Z" fill="rgba(255,255,255,0.15)"/>
        <path d="M40 80 L25 160 L100 140 Z" fill="rgba(255,255,255,0.1)"/>
        <path d="M160 80 L175 160 L100 140 Z" fill="rgba(255,255,255,0.2)"/>
        <path d="M25 160 L55 280 L100 200 Z" fill="rgba(0,50,150,0.3)"/>
        <path d="M175 160 L145 280 L100 200 Z" fill="rgba(0,30,120,0.4)"/>
        <path d="M55 280 L100 300 L145 280 L100 200 Z" fill="rgba(0,20,80,0.5)"/>

        <!-- Center circle -->
        <circle cx="100" cy="160" r="38" fill="rgba(10,20,50,0.7)" stroke="#7ec8ff" stroke-width="2"/>
        <text x="100" y="155" text-anchor="middle" fill="white" font-size="28" font-weight="bold">N</text>
        <text x="100" y="180" text-anchor="middle" fill="#a0d8ff" font-size="14" font-weight="600">NETO</text>
      </svg>
    </div>

    <!-- Bracket JULAT -->
    <svg class="bracket" viewBox="0 0 50 340">
      <path d="M40 10 
               Q10 10 10 40 
               L10 300 
               Q10 330 40 330" 
            fill="none" 
            stroke="#4fc3f7" 
            stroke-width="4"
            stroke-linecap="round"/>
    </svg>

    <div class="julat">JULAT</div>

    <!-- Labels -->
    <div class="label t-tinggi">
      <span class="letter">T</span> TINGGI
    </div>
    <div class="label a-atas">
      <span class="letter">A</span> ATAS
    </div>
    <div class="label i-inti">
      <span class="letter">I</span> INTI
    </div>
    <div class="label b-bawah">
      <span class="letter">B</span> BAWAH
    </div>
    <div class="label r-rendah">
      <span class="letter">R</span> RENDAH
    </div>

    <div class="label a-awal">
      <span class="letter">A</span> AWAL
    </div>

    <!-- Dots -->
    <div class="dot blue" style="top: 108px; left: 400px;"></div>
    <div class="dot red"  style="top: 505px; left: 400px;"></div>

    <!-- Connecting lines -->
    <div style="position:absolute; top:114px; left:350px; width:50px; height:2px; background:#4fc3f7;"></div>
    <div style="position:absolute; top:225px; left:380px; width:90px; height:2px; background:linear-gradient(90deg,#4fc3f7,transparent); border-top:2px dashed #4fc3f7;"></div>
    <div style="position:absolute; top:390px; left:140px; width:100px; height:2px; background:linear-gradient(90deg,transparent,#4fc3f7); border-top:2px dashed #4fc3f7;"></div>
    <div style="position:absolute; top:511px; left:350px; width:50px; height:2px; background:#ff5252;"></div>

    <!-- Vertical line through crystal -->
    <div style="position:absolute; top:110px; left:349px; width:2px; height:400px; background:linear-gradient(to bottom, #4fc3f7, transparent, #ff5252);"></div>

    <div class="title">TABRANIJ</div>
  </div>
</body>
</html>
