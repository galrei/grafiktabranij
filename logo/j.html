<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TABRANIJ Crystal Diagram</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e17;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 580px;
      height: 620px;
    }

    /* Crystal */
    .crystal {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 280px;
      filter: drop-shadow(0 0 20px rgba(100, 180, 255, 0.55));
    }

    .crystal svg {
      width: 100%;
      height: 100%;
    }

    /* Labels */
    .label {
      position: absolute;
      color: white;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(100, 180, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .label .letter {
      font-size: 19px;
      font-weight: 700;
    }

    /* Positions */
    .t-tinggi { top: 48px;  left: 355px; }
    .a-atas   { top: 100px; left: 355px; }
    .i-inti   { top: 150px; left: 400px; }
    .b-bawah  { top: 370px; left: 355px; }
    .r-rendah { top: 440px; left: 355px; }

    /* A AWAL di jam 6 */
    .a-awal {
      top: 485px;
      left: 50%;
      transform: translateX(-50%);
    }

    .julat {
      position: absolute;
      left: 10px;
      top: 200px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-shadow: 0 0 10px rgba(100, 180, 255, 0.7);
    }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .dot.blue { background: #4fc3f7; color: #4fc3f7; }
    .dot.red  { background: #ff5252; color: #ff5252; }

    .title {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #1a237e, #0d47a1);
      color: white;
      padding: 10px 36px;
      border-radius: 40px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      box-shadow: 0 0 18px rgba(30, 100, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Crystal -->
    <div class="crystal">
      <svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ec8ff"/>
            <stop offset="30%" stop-color="#4a9eff"/>
            <stop offset="60%" stop-color="#2a6aff"/>
            <stop offset="100%" stop-color="#1a3a8f"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <path d="M100 20 
                 L160 80 
                 L175 160 
                 L145 280 
                 L100 300 
                 L55 280 
                 L25 160 
                 L40 80 Z" 
              fill="url(#crystalGrad)" 
              stroke="#a0d8ff" 
              stroke-width="2"
              filter="url(#glow)"/>

        <path d="M100 20 L160 80 L100 140 Z" fill="rgba(255,255,255,0.25)"/>
        <path d="M100 20 L40 80 L100 140 Z" fill="rgba(255,255,255,0.15)"/>
        <path d="M40 80 L25 160 L100 140 Z" fill="rgba(255,255,255,0.1)"/>
        <path d="M160 80 L175 160 L100 140 Z" fill="rgba(255,255,255,0.2)"/>
        <path d="M25 160 L55 280 L100 200 Z" fill="rgba(0,50,150,0.3)"/>
        <path d="M175 160 L145 280 L100 200 Z" fill="rgba(0,30,120,0.4)"/>
        <path d="M55 280 L100 300 L145 280 L100 200 Z" fill="rgba(0,20,80,0.5)"/>

        <circle cx="100" cy="160" r="36" fill="rgba(10,20,50,0.7)" stroke="#7ec8ff" stroke-width="2"/>
        <text x="100" y="153" text-anchor="middle" fill="white" font-size="26" font-weight="bold">N</text>
        <text x="100" y="178" text-anchor="middle" fill="#a0d8ff" font-size="13" font-weight="600">NETO</text>
      </svg>
    </div>

    <!-- Bracket JULAT -->
    <svg style="position:absolute; left:55px; top:35px; width:50px; height:440px;" viewBox="0 0 50 440">
      <path d="M40 5 
               Q5 5 5 40 
               L5 400 
               Q5 435 40 435" 
            fill="none" 
            stroke="#4fc3f7" 
            stroke-width="4.5"
            stroke-linecap="round"/>
    </svg>

    <div class="julat">JULAT</div>

    <!-- Labels -->
    <div class="label t-tinggi"><span class="letter">T</span> TINGGI</div>
    <div class="label a-atas"><span class="letter">A</span> ATAS</div>
    <div class="label i-inti"><span class="letter">I</span> INTI</div>
    <div class="label b-bawah"><span class="letter">B</span> BAWAH</div>
    <div class="label r-rendah"><span class="letter">R</span> RENDAH</div>
    <div class="label a-awal"><span class="letter">A</span> AWAL</div>

    <!-- Titik biru tepat di jam 12 -->
    <div class="dot blue" style="top:58px; left:285px;"></div>
    
    <!-- Titik merah tepat di jam 6 -->
    <div class="dot red"  style="top:455px; left:285px;"></div>

    <!-- Garis biru horizontal dari sudut jam 12 -->
    <div style="position:absolute; top:63px; left:290px; width:55px; height:2px; background:#4fc3f7;"></div>

    <!-- Garis putus-putus INTI -->
    <div style="position:absolute; top:160px; left:310px; width:80px; height:0; border-top:2px dashed #4fc3f7;"></div>

    <!-- Garis merah horizontal dari sudut jam 6 -->
    <div style="position:absolute; top:460px; left:290px; width:55px; height:2px; background:#ff5252;"></div>

    <!-- ===== Garis putus-putus A AWAL tepat sejajar sudut jam 6 ===== -->
    <div style="position:absolute; top:460px; left:50%; width:2px; height:30px;
                background: repeating-linear-gradient(
                  to bottom,
                  #4fc3f7 0px,
                  #4fc3f7 5px,
                  transparent 5px,
                  transparent 10px
                );
                transform: translateX(-50%);">
    </div>

    <!-- Garis vertikal utama (dari jam 12 ke jam 6) -->
    <div style="position:absolute; top:63px; left:289px; width:2px; height:397px; 
                background: linear-gradient(to bottom, #4fc3f7 0%, #4fc3f7 30%, transparent 45%, #ff5252 55%, #ff5252 100%);">
    </div>

    <div class="title">TABRANIJ</div>
  </div>
</body>
</html>
